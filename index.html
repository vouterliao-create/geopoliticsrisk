<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEOINT // Global Intelligence Dashboard v3</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#030b14;--surface:#050e1a;--surface2:#071220;--border:#0d2035;
  --amber:#f59e0b;--cyan:#22d3ee;--green:#10b981;
  --red:#ef4444;--purple:#a78bfa;--orange:#f97316;
  --text:#7a9bbf;--bright:#c8dff0;
  --mono:'Share Tech Mono','Courier New',monospace;
  --ui:'Rajdhani',sans-serif;
}
body{font-family:var(--mono);background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;}

/* HEADER */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:42px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;z-index:1000;}
.hdr-l{display:flex;align-items:center;gap:12px;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 2.5s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
.logo{font-family:var(--ui);font-weight:700;font-size:13px;letter-spacing:3px;color:var(--cyan);text-transform:uppercase;}
.logo em{color:var(--amber);font-style:normal;}
.badge{font-size:9px;padding:2px 6px;border:1px solid var(--border);color:#2a5070;letter-spacing:1px;}
.hdr-r{display:flex;gap:20px;align-items:center;}
.hs{display:flex;flex-direction:column;align-items:flex-end;}
.hs-l{font-size:8px;color:#2a5070;letter-spacing:1.5px;text-transform:uppercase;}
.hs-v{font-size:12px;color:var(--amber);}

/* MAIN */
.main{display:flex;flex:1;overflow:hidden;}

/* LEFT PANEL */
.lp{width:210px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0;}
.ps{border-bottom:1px solid var(--border);padding:10px 12px;}
.pt{font-family:var(--ui);font-weight:600;font-size:9px;letter-spacing:2px;color:#2a5070;text-transform:uppercase;margin-bottom:8px;}
.lr{display:flex;align-items:center;gap:7px;padding:5px 0;cursor:pointer;font-size:11px;color:var(--text);transition:color .2s;}
.lr:hover{color:var(--bright);}
.ld{width:9px;height:9px;border-radius:2px;flex-shrink:0;}
.sw{margin-left:auto;width:26px;height:13px;border-radius:7px;border:1px solid #0d2035;background:#060f1a;position:relative;cursor:pointer;transition:border-color .2s;}
.sw.on{border-color:var(--cyan);}
.sw-k{width:9px;height:9px;border-radius:50%;background:#1e3a5f;position:absolute;top:1px;left:1px;transition:all .2s;}
.sw.on .sw-k{left:14px;background:var(--cyan);}
.leg{display:flex;align-items:center;gap:7px;padding:3px 0;font-size:10px;}
.ld-sm{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.rr{display:flex;align-items:center;gap:5px;padding:4px 0;border-bottom:1px solid #050d19;font-size:10px;}
.rbw{width:44px;height:3px;background:#060f1a;border-radius:2px;overflow:hidden;}
.rb{height:100%;border-radius:2px;}
.vb{display:block;width:100%;background:transparent;border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:10px;padding:5px 8px;cursor:pointer;text-align:left;transition:all .2s;margin-bottom:4px;}
.vb:hover{border-color:var(--cyan);color:var(--cyan);}
.cat-btns{display:flex;gap:4px;flex-wrap:wrap;}
.cb{font-family:var(--mono);font-size:9px;padding:3px 7px;border:1px solid var(--border);background:transparent;color:#2a5070;cursor:pointer;letter-spacing:.5px;transition:all .2s;}
.cb.act{border-color:var(--cyan);color:var(--cyan);background:rgba(34,211,238,.06);}

/* My Events list */
.ev-item{display:flex;align-items:flex-start;gap:6px;padding:6px 0;border-bottom:1px solid #050d19;font-size:10px;}
.ev-dot{width:7px;height:7px;border-radius:50%;border:1.5px solid;flex-shrink:0;margin-top:3px;}
.ev-info{flex:1;min-width:0;}
.ev-name{color:var(--bright);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ev-meta{font-size:9px;color:#2a5070;margin-top:1px;}
.ev-del{background:transparent;border:none;color:#1e3a5f;cursor:pointer;font-size:12px;padding:0 2px;flex-shrink:0;transition:color .2s;}
.ev-del:hover{color:var(--red);}
.ev-empty{font-size:10px;color:#1e3a5f;padding:6px 0;line-height:1.6;}

/* Add Event button */
.add-btn{width:100%;padding:8px;background:transparent;border:1px dashed var(--cyan);color:var(--cyan);font-family:var(--mono);font-size:10px;letter-spacing:1px;cursor:pointer;transition:all .2s;text-transform:uppercase;}
.add-btn:hover{background:rgba(34,211,238,.07);}
.add-btn.active{background:rgba(34,211,238,.12);border-style:solid;}

/* MAP */
#map{flex:1;z-index:1;}
.leaflet-container{background:#010812 !important;}
.sc-tip{background:var(--surface) !important;border:1px solid var(--border) !important;border-radius:3px !important;color:var(--bright) !important;font-family:var(--mono) !important;font-size:11px !important;padding:6px 10px !important;box-shadow:0 4px 16px rgba(0,0,0,.6) !important;}

/* Placement mode cursor */
#map.placing{cursor:crosshair !important;}

/* RIGHT PANEL */
.rp{width:300px;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;}
.rp-h{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
.rp-t{font-family:var(--ui);font-weight:700;font-size:10px;letter-spacing:2px;color:var(--cyan);text-transform:uppercase;}
.rp-b{flex:1;overflow-y:auto;padding:14px;}
.es{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;gap:10px;}
.es-icon{font-size:36px;color:#1a3352;}
.es-txt{font-size:10px;line-height:1.7;max-width:180px;color:#1e3a5f;}
.nc{display:none;}
.nc.show{display:block;}
.ttag{display:inline-block;font-size:8px;padding:2px 7px;border-radius:2px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;}
.nn{font-family:var(--ui);font-weight:700;font-size:17px;color:var(--bright);margin-bottom:3px;line-height:1.2;}
.nco{font-size:10px;margin-bottom:12px;letter-spacing:1px;}
.nm{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px;}
.mi{background:#040b15;border:1px solid var(--border);padding:7px 8px;border-radius:2px;}
.mi.full{grid-column:1/-1;}
.ml{font-size:8px;color:#2a5070;text-transform:uppercase;letter-spacing:1px;margin-bottom:3px;}
.mv{font-size:11px;color:var(--bright);line-height:1.4;}
.aib{width:100%;padding:9px;background:transparent;border:1px solid var(--cyan);color:var(--cyan);font-family:var(--mono);font-size:10px;letter-spacing:1px;cursor:pointer;text-transform:uppercase;transition:all .2s;border-radius:2px;}
.aib:hover{background:rgba(34,211,238,.07);}
.aib:disabled{border-color:#0d2035;color:#1e3a5f;cursor:not-allowed;background:transparent;}
.ail{display:none;font-size:10px;color:var(--cyan);padding:10px 0;letter-spacing:1px;animation:blink 1.2s infinite;}
.ail.show{display:block;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.aio{display:none;margin-top:10px;font-size:10.5px;line-height:1.75;color:var(--text);border-top:1px solid var(--border);padding-top:10px;}
.aio.show{display:block;}
.aio p{margin-bottom:8px;}

/* ADD EVENT FORM */
.add-form{display:none;}
.add-form.show{display:block;}
.form-field{margin-bottom:12px;}
.form-label{font-size:9px;color:#2a5070;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;display:block;}
.form-input{width:100%;background:#040b15;border:1px solid var(--border);color:var(--bright);font-family:var(--mono);font-size:11px;padding:7px 9px;border-radius:2px;outline:none;transition:border-color .2s;}
.form-input:focus{border-color:var(--cyan);}
.form-input::placeholder{color:#1e3a5f;}
textarea.form-input{resize:vertical;min-height:70px;line-height:1.5;}
.form-cats{display:flex;gap:5px;flex-wrap:wrap;}
.fcat{font-family:var(--mono);font-size:9px;padding:4px 9px;border:1px solid var(--border);background:transparent;color:#2a5070;cursor:pointer;letter-spacing:.5px;border-radius:2px;transition:all .2s;}
.fcat.act{border-color:var(--cyan);color:var(--cyan);background:rgba(34,211,238,.08);}
.risk-row{display:flex;align-items:center;gap:8px;}
.risk-row input[type=range]{flex:1;accent-color:var(--cyan);}
.risk-val{font-size:12px;font-weight:600;min-width:28px;text-align:right;}
.coord-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.coord-hint{font-size:9px;color:#1e3a5f;margin-top:4px;display:flex;align-items:center;gap:4px;}
.coord-hint.active{color:var(--cyan);}
.coord-dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);animation:blink 1s infinite;flex-shrink:0;}
.form-btns{display:flex;gap:6px;margin-top:14px;}
.form-btn{flex:1;padding:9px;font-family:var(--mono);font-size:10px;letter-spacing:1px;cursor:pointer;text-transform:uppercase;border-radius:2px;transition:all .2s;}
.form-btn.save{background:transparent;border:1px solid var(--cyan);color:var(--cyan);}
.form-btn.save:hover{background:rgba(34,211,238,.1);}
.form-btn.cancel{background:transparent;border:1px solid var(--border);color:var(--text);}
.form-btn.cancel:hover{border-color:var(--red);color:var(--red);}

/* TICKER */
.tkr{height:26px;background:#020810;border-top:1px solid var(--border);display:flex;align-items:center;overflow:hidden;flex-shrink:0;}
.tkr-l{padding:0 12px;font-size:8px;letter-spacing:2px;color:var(--amber);text-transform:uppercase;border-right:1px solid var(--border);height:100%;display:flex;align-items:center;white-space:nowrap;flex-shrink:0;}
.tkr-tr{overflow:hidden;flex:1;position:relative;height:100%;}
.tkr-in{white-space:nowrap;animation:scroll 100s linear infinite;font-size:10px;color:var(--text);height:100%;display:flex;align-items:center;position:absolute;}
@keyframes scroll{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}
.ts{margin:0 16px;color:#0d2035;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:#0d2035;border-radius:2px;}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-l">
    <div class="dot"></div>
    <div class="logo">GEOINT <em>//</em> Global Intelligence</div>
    <div class="badge">半自動 · 人工判讀</div>
  </div>
  <div class="hdr-r">
    <div class="hs"><div class="hs-l">預設事件</div><div class="hs-v" id="h-preset">20</div></div>
    <div class="hs"><div class="hs-l">我的事件</div><div class="hs-v" style="color:var(--green)" id="h-user">0</div></div>
    <div class="hs"><div class="hs-l">SC Nodes</div><div class="hs-v">12</div></div>
    <div class="hs"><div class="hs-l">UTC</div><div class="hs-v" style="color:var(--bright)" id="clock">—</div></div>
  </div>
</div>

<div class="main">

  <!-- LEFT PANEL -->
  <div class="lp">

    <div class="ps">
      <div class="pt">圖層</div>
      <div class="lr" onclick="toggleLayer('chor')">
        <div class="ld" style="background:linear-gradient(90deg,#ef4444,#f59e0b,#10b981)"></div>
        <span>風險 Choropleth</span>
        <div class="sw on" id="sw-chor"><div class="sw-k"></div></div>
      </div>
      <div class="lr" onclick="toggleLayer('nodes')">
        <div class="ld" style="background:var(--cyan)"></div>
        <span>SC 節點</span>
        <div class="sw on" id="sw-nodes"><div class="sw-k"></div></div>
      </div>
      <div class="lr" onclick="toggleLayer('routes')">
        <div class="ld" style="background:var(--amber)"></div>
        <span>供應路線</span>
        <div class="sw on" id="sw-routes"><div class="sw-k"></div></div>
      </div>
      <div class="lr" onclick="toggleLayer('events')">
        <div class="ld" style="background:var(--red)"></div>
        <span>預設事件</span>
        <div class="sw on" id="sw-events"><div class="sw-k"></div></div>
      </div>
      <div class="lr" onclick="toggleLayer('user')">
        <div class="ld" style="background:var(--green)"></div>
        <span>我的事件</span>
        <div class="sw on" id="sw-user"><div class="sw-k"></div></div>
      </div>
    </div>

    <div class="ps">
      <div class="pt">事件篩選</div>
      <div class="cat-btns">
        <button class="cb act" onclick="filterEvts('ALL',this)">ALL</button>
        <button class="cb" onclick="filterEvts('SC',this)">SC</button>
        <button class="cb" onclick="filterEvts('CONFLICT',this)">衝突</button>
        <button class="cb" onclick="filterEvts('POLICY',this)">政策</button>
      </div>
    </div>

    <div class="ps">
      <div class="pt">政治風險指數</div>
      <div id="risk-list"></div>
    </div>

    <div class="ps">
      <div class="pt">快速定位</div>
      <button class="vb" onclick="fly(25,121,6)">▸ 台灣海峽</button>
      <button class="vb" onclick="fly(36,128,5)">▸ 東北亞</button>
      <button class="vb" onclick="fly(51,6,5)">▸ 歐洲 / ASML</button>
      <button class="vb" onclick="fly(37,-108,4)">▸ 北美</button>
      <button class="vb" onclick="fly(22,40,4)">▸ 中東</button>
      <button class="vb" onclick="fly(50,30,5)">▸ 東歐</button>
      <button class="vb" onclick="fly(25,80,2.5)">▸ 全球</button>
    </div>

    <!-- MY EVENTS -->
    <div class="ps" style="flex:1">
      <div class="pt">我的事件</div>
      <div id="user-list"><div class="ev-empty">尚無自訂事件<br>點下方按鈕新增</div></div>
    </div>

    <div class="ps" style="padding:10px 12px;">
      <button class="add-btn" id="add-btn" onclick="enterAddMode()">＋ 新增地緣政治事件</button>
    </div>

  </div>

  <!-- MAP -->
  <div id="map"></div>

  <!-- RIGHT PANEL -->
  <div class="rp">
    <div class="rp-h">
      <div class="rp-t" id="rp-title">// 情報分析</div>
      <div style="font-size:8px;color:var(--cyan);letter-spacing:1px" id="rp-badge">AI · CLAUDE</div>
    </div>
    <div class="rp-b" id="rp-body">

      <!-- Empty state -->
      <div class="es" id="es">
        <div class="es-icon">◎</div>
        <div class="es-txt">點選地圖上任何節點、事件或國家，生成 AI 情報簡報</div>
      </div>

      <!-- Analysis card -->
      <div class="nc" id="nc">
        <div class="ttag" id="ntag"></div>
        <div class="nn" id="nname"></div>
        <div class="nco" id="nco"></div>
        <div class="nm" id="nm"></div>
        <button class="aib" id="aib" onclick="runAI()">▶ 生成情報簡報</button>
        <div class="ail" id="ail">QUERYING CLAUDE API ...</div>
        <div class="aio" id="aio"></div>
      </div>

      <!-- Add event form -->
      <div class="add-form" id="add-form">
        <div style="font-size:10px;color:var(--amber);margin-bottom:14px;line-height:1.6;" id="place-hint">
          <span id="place-dot" style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--amber);animation:blink 1s infinite;margin-right:5px;"></span>
          點擊地圖選擇事件位置
        </div>

        <div class="form-field">
          <label class="form-label">事件名稱</label>
          <input class="form-input" id="f-name" placeholder="例：南海油氣田開採衝突" maxlength="60">
        </div>

        <div class="form-field">
          <label class="form-label">類別</label>
          <div class="form-cats">
            <div class="fcat act" data-cat="SC" onclick="selectCat(this)">半導體</div>
            <div class="fcat" data-cat="CONFLICT" onclick="selectCat(this)">衝突</div>
            <div class="fcat" data-cat="POLICY" onclick="selectCat(this)">政策</div>
            <div class="fcat" data-cat="ECON" onclick="selectCat(this)">經濟</div>
            <div class="fcat" data-cat="OTHER" onclick="selectCat(this)">其他</div>
          </div>
        </div>

        <div class="form-field">
          <label class="form-label">風險等級</label>
          <div class="risk-row">
            <input type="range" min="1" max="10" value="5" id="f-risk" oninput="updateRiskColor()">
            <div class="risk-val" id="f-risk-val">5</div>
          </div>
        </div>

        <div class="form-field">
          <label class="form-label">事件描述</label>
          <textarea class="form-input" id="f-desc" placeholder="簡述事件背景、影響及地緣政治意涵..."></textarea>
        </div>

        <div class="form-field">
          <label class="form-label">座標（點擊地圖自動填入）</label>
          <div class="coord-row">
            <input class="form-input" id="f-lat" placeholder="緯度" type="number" step="0.01">
            <input class="form-input" id="f-lon" placeholder="經度" type="number" step="0.01">
          </div>
          <div class="coord-hint active" id="coord-hint">
            <div class="coord-dot"></div>
            點擊地圖設定位置
          </div>
        </div>

        <div class="form-btns">
          <button class="form-btn save" onclick="saveEvent()">✓ 儲存事件</button>
          <button class="form-btn cancel" onclick="exitAddMode()">✕ 取消</button>
        </div>
      </div>

    </div>
  </div>

</div>

<div class="tkr">
  <div class="tkr-l">情報快訊</div>
  <div class="tkr-tr"><div class="tkr-in" id="ticker">載入情報資訊...</div></div>
</div>

<script>

const STORAGE_KEY = 'geoint_user_events_v1';
let userEvents = [];

async function loadUserEvents() {
  try {
    const r = await window.storage.get(STORAGE_KEY);
    userEvents = r ? JSON.parse(r.value) : [];
  } catch(e) {
    userEvents = [];
  }
  renderUserList();
  renderUserMarkers();
  updateUserCount();
}

async function persistUserEvents() {
  try {
    await window.storage.set(STORAGE_KEY, JSON.stringify(userEvents));
  } catch(e) { console.warn('Storage failed:', e); }
}

function updateUserCount() {
  document.getElementById('h-user').textContent = userEvents.length;
}

// Choropleth
async function loadChoropleth(){
  try{
    const res=await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');
    const world=await res.json();
    const countries=topojson.feature(world,world.objects.countries);
    L.geoJSON(countries,{
      style:f=>{
        const s=ISO_R[parseInt(f.id)]||0;
        const fill=s>=8?'#ef4444':s>=6?'#f97316':s>=4?'#f59e0b':s>=2?'#10b981':'transparent';
        return{fillColor:fill,fillOpacity:s>0?.2:0,color:'#0d2035',weight:.5,opacity:.5};
      },
      onEachFeature:(f,layer)=>{
        const id=parseInt(f.id);
        const s=ISO_R[id];
        if(s){
          layer.on('click',e=>{L.DomEvent.stopPropagation(e);if(!addMode)showCountry(id,s);});
          layer.on('mouseover',function(){this.setStyle({fillOpacity:.32});});
          layer.on('mouseout',function(){this.setStyle({fillOpacity:.2});});
        }
      }
    }).addTo(LG.chor);
  }catch(e){}
}
loadChoropleth();

let addMode = false;

function riskColor(s){

function enterAddMode(){
  addMode=true;
  document.getElementById('map').classList.add('placing');
  document.getElementById('add-btn').classList.add('active');
  document.getElementById('add-btn').textContent='◎ 點擊地圖放置位置...';

  // Switch right panel to form
  document.getElementById('es').style.display='none';
  document.getElementById('nc').classList.remove('show');
  document.getElementById('add-form').classList.add('show');
  document.getElementById('rp-title').textContent='// 新增事件';
  document.getElementById('rp-badge').textContent='人工判讀';

  // Reset form
  document.getElementById('f-name').value='';
  document.getElementById('f-desc').value='';
  document.getElementById('f-lat').value='';
  document.getElementById('f-lon').value='';
  document.getElementById('f-risk').value=5;
  updateRiskColor();
  document.querySelectorAll('.fcat').forEach(b=>b.classList.remove('act'));
  document.querySelector('.fcat[data-cat="SC"]').classList.add('act');
  selectedCat='SC';
}

function exitAddMode(){
  addMode=false;
  document.getElementById('map').classList.remove('placing');
  document.getElementById('add-btn').classList.remove('active');
  document.getElementById('add-btn').textContent='＋ 新增地緣政治事件';

  document.getElementById('es').style.display='';
  document.getElementById('nc').classList.remove('show');
}

// Map click → set coordinates when in add mode
map.on('click', function(e){
  if(!addMode) return;
  const {lat,lng}=e.latlng;
  document.getElementById('f-lat').value=lat.toFixed(4);
  document.getElementById('f-lon').value=lng.toFixed(4);
  document.getElementById('place-hint').style.color='var(--green)';
  document.getElementById('place-hint').innerHTML='<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:5px;"></span>位置已設定 (' + lat.toFixed(2) + ', ' + lng.toFixed(2) + ')';
});

function selectCat(el){
  document.querySelectorAll('.fcat').forEach(b=>b.classList.remove('act'));
  el.classList.add('act');
  selectedCat=el.dataset.cat;
}

function updateRiskColor(){
  const s=parseInt(document.getElementById('f-risk').value);
  document.getElementById('f-risk-val').textContent=s;
  document.getElementById('f-risk-val').style.color=riskColor(s);
}

async function saveEvent(){
  const name=document.getElementById('f-name').value.trim();
  const lat=parseFloat(document.getElementById('f-lat').value);
  const lon=parseFloat(document.getElementById('f-lon').value);
  const desc=document.getElementById('f-desc').value.trim();
  const risk=parseInt(document.getElementById('f-risk').value);

  if(!name){alert('請輸入事件名稱');return;}
  if(isNaN(lat)||isNaN(lon)){alert('請點擊地圖選擇位置');return;}

  const evt={
    id: Date.now(),
    name, lat, lon, desc, risk,
    cat: selectedCat,
    created: new Date().toISOString().slice(0,10),
  };

  userEvents.unshift(evt);
  await persistUserEvents();
  renderUserList();
  renderUserMarkers();
  updateUserCount();
  exitAddMode();

  // Show the new event card
  showUserEvent(evt);
}

function renderUserList(){
  const el=document.getElementById('user-list');
  if(userEvents.length===0){
    el.innerHTML='<div class="ev-empty">尚無自訂事件<br>點下方按鈕新增</div>';
    return;
  }
  el.innerHTML=userEvents.map(evt=>{

    return`<div class="ev-item">
      <div class="ev-dot" style="border-color:${col};background:${col}33"></div>
      <div class="ev-info">
        <div class="ev-name">${evt.name}</div>
        <div class="ev-meta">${evt.cat} · ${evt.created} · 風險 ${evt.risk}</div>
      </div>
      <button class="ev-del" onclick="deleteEvent(${evt.id})" title="刪除">✕</button>
    </div>`;
  }).join('');
}

async function deleteEvent(id){
  if(!confirm('確定刪除這個事件？')) return;
  userEvents=userEvents.filter(e=>e.id!==id);
  await persistUserEvents();
  renderUserList();
  renderUserMarkers();
  updateUserCount();
}

  const prompt=`你是一位專精半導體供應鏈、美中科技競爭與國際政治風險分析的資深地緣政治分析師。

分析對象：${curPrompt}

請以繁體中文撰寫一份簡報（200 字以內，純段落，不用條列）：
1. 在全球半導體供應鏈中的戰略意義
2. 美中科技競爭或地緣政治緊張角度
3. 未來 12–24 個月的政治風險評估（標示風險等級：低/中/高/關鍵）
4. 一個關鍵情境需持續追蹤

語氣：資深分析師備忘錄。具體、有數據依據。`;
  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,messages:[{role:"user",content:prompt}]})
    });
    const data=await res.json();
    const text=data.content?.[0]?.text||"分析無法取得。";
    load.classList.remove('show');
    out.innerHTML=text.split('\n').filter(l=>l.trim()).map(p=>`<p>${p}</p>`).join('');
    out.classList.add('show');
    btn.textContent='↻ 重新生成'; btn.disabled=false;
  }catch(e){
    load.classList.remove('show');
    out.innerHTML=`<p style="color:var(--red)">連線錯誤，請重試。</p>`;
    out.classList.add('show'); btn.disabled=false;
    btn.textContent='▶ 生成情報簡報';
  }
}

// ═══════════════════════════════
// LAYER / FILTER CONTROL
// ═══════════════════════════════

function toggleLayer(n){
  LO[n]=!LO[n];
  const sw=document.getElementById('sw-'+n);
  if(LO[n]){map.addLayer(LG[n]);sw.classList.add('on');}
  else{map.removeLayer(LG[n]);sw.classList.remove('on');}
}
function filterEvts(cat,btn){
  activeCat=cat;
  document.querySelectorAll('.cb').forEach(b=>b.classList.remove('act'));
  btn.classList.add('act');
  renderPresetEvents(cat);
}
function fly(lat,lon,z){map.flyTo([lat,lon],z,{duration:1.6});}

// ═══════════════════════════════
// RISK PANEL
// ═══════════════════════════════

const rl=document.getElementById('risk-list');
RISK.forEach(r=>{
  const col=r.s>=8?'var(--red)':r.s>=6?'var(--orange)':r.s>=4?'var(--amber)':'var(--green)';
  rl.innerHTML+=`<div class="rr">
    <span style="flex:1">${r.c}</span>
    <span style="font-size:9px;color:#2a5070">${r.t}</span>
    <div class="rbw"><div class="rb" style="width:${r.s*10}%;background:${col}"></div></div>
    <span style="font-size:10px;width:24px;text-align:right;color:${col}">${r.s}</span>
  </div>`;
});

// ═══════════════════════════════
// TICKER
// ═══════════════════════════════

async function loadTicker(){
  let items=[...TICKERS];
  try{
    const res=await fetch('https://api.gdeltproject.org/api/v2/doc/doc?query=semiconductor+taiwan+china+geopolitical&mode=artlist&maxrecords=6&format=json&timespan=3d',{signal:AbortSignal.timeout(5000)});
    if(res.ok){const data=await res.json();if(data.articles){const live=data.articles.map(a=>`[LIVE] ${a.title}`).filter(Boolean).slice(0,5);items=[...live,...TICKERS];}}
  }catch(e){}
  document.getElementById('ticker').innerHTML=items.map(t=>`<span>${t}</span><span class="ts">◆</span>`).join('');
}
loadTicker();

// ═══════════════════════════════
// CLOCK + INIT
// ═══════════════════════════════

function tick(){document.getElementById('clock').textContent=new Date().toUTCString().split(' ')[4]+' UTC';}
tick(); setInterval(tick,1000);

// Load user events from persistent storage
loadUserEvents();
