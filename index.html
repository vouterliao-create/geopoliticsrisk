<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEOINT // Global Intelligence Dashboard v3</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root {
  --bg: #0a0e1a;
  --panel: #121726;
  --panel-light: #1a2238;
  --border: #2a3350;
  --text: #e2e8f0;
  --text-dim: #94a3b8;
  --accent: #60a5fa;
  --cyan: #22d3ee;
  --red: #ef4444;
  --orange: #f97316;
  --yellow: #eab308;
  --green: #22c55e;
  --amber: #f59e0b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text); overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "SF Mono", "Monaco", monospace;
  min-height: 100vh;
}

/* ===== Top Header ===== */
.topbar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 24px; background: var(--panel);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 1000;
}
.brand {
  font-size: 14px; letter-spacing: 3px; color: var(--cyan);
  display: flex; align-items: center; gap: 8px;
}
.brand-dot { width: 8px; height: 8px; background: var(--cyan); border-radius: 50%; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
.mode-tabs { display: flex; gap: 6px; }
.mode-tab {
  padding: 4px 12px; font-size: 11px; border-radius: 4px;
  background: var(--panel-light); color: var(--text-dim);
  border: 1px solid var(--border); cursor: pointer;
}
.mode-tab.active { background: var(--cyan); color: #000; }
.topstats { display: flex; gap: 24px; align-items: center; }
.topstat { text-align: center; }
.topstat-label { font-size: 10px; color: var(--text-dim); letter-spacing: 1px; }
.topstat-val { font-size: 18px; font-weight: 600; color: var(--text); }
.topstat-utc .topstat-val { color: var(--cyan); font-family: monospace; }

/* ===== Layout ===== */
.app {
  display: grid;
  grid-template-columns: 260px 1fr 320px;
  height: calc(100vh - 56px);
}
.sidebar, .right-panel {
  background: var(--panel); overflow-y: auto;
  border-right: 1px solid var(--border);
}
.right-panel { border-right: none; border-left: 1px solid var(--border); }
.sidebar-section { padding: 16px 18px; border-bottom: 1px solid var(--border); }
.sidebar-h {
  font-size: 11px; letter-spacing: 2px; color: var(--text-dim);
  margin-bottom: 12px; text-transform: uppercase;
}

/* ===== Layers ===== */
.layer-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 7px 0; font-size: 13px;
}
.layer-label { display: flex; align-items: center; gap: 8px; }
.layer-dot { width: 10px; height: 10px; border-radius: 50%; }
.toggle {
  width: 32px; height: 18px; background: var(--border); border-radius: 10px;
  position: relative; cursor: pointer; transition: background 0.2s;
}
.toggle.on { background: var(--cyan); }
.toggle::after {
  content: ''; position: absolute; top: 2px; left: 2px;
  width: 14px; height: 14px; background: #fff; border-radius: 50%;
  transition: left 0.2s;
}
.toggle.on::after { left: 16px; }

/* ===== Filter buttons ===== */
.filter-row { display: flex; gap: 6px; flex-wrap: wrap; }
.filter-btn {
  padding: 4px 10px; font-size: 11px; border-radius: 4px;
  background: var(--panel-light); color: var(--text-dim);
  border: 1px solid var(--border); cursor: pointer;
}
.filter-btn.active { background: var(--cyan); color: #000; border-color: var(--cyan); }

/* ===== Risk rankings ===== */
.risk-item { margin-bottom: 10px; }
.risk-row {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 12px; margin-bottom: 4px;
}
.risk-country { color: var(--text); }
.risk-score { font-weight: 600; color: var(--amber); }
.risk-bar {
  height: 4px; background: #0a0e1a; border-radius: 2px; overflow: hidden;
}
.risk-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--green), var(--yellow), var(--red));
}

/* ===== Quick nav ===== */
.quicknav-item {
  padding: 8px 0; font-size: 13px; color: var(--text-dim);
  cursor: pointer; border-bottom: 1px solid var(--border);
}
.quicknav-item:hover { color: var(--cyan); }
.quicknav-item:last-child { border-bottom: none; }

/* ===== My events ===== */
.my-events-empty {
  padding: 24px 0; text-align: center; color: var(--text-dim); font-size: 12px;
}
.add-event-btn {
  width: 100%; padding: 10px; background: var(--cyan); color: #000;
  border: none; border-radius: 6px; font-weight: 600; cursor: pointer;
  margin-top: 10px;
}

/* ===== Map ===== */
#map { height: 100%; background: #0a0e1a; }
/* OSM 彩色底圖轉暗色情報風格 */
.leaflet-tile {
  filter: brightness(0.5) invert(1) contrast(1.3) hue-rotate(200deg) saturate(0.3) brightness(0.85);
}
.leaflet-container { background: #0a0e1a; }

/* ===== Right panel ===== */
.right-h {
  padding: 16px 18px; border-bottom: 1px solid var(--border);
}
.right-title {
  font-size: 13px; letter-spacing: 2px; display: flex;
  justify-content: space-between; align-items: center;
}
.right-title-right { font-size: 10px; color: var(--cyan); }
.intel-content {
  padding: 60px 20px; text-align: center; color: var(--text-dim);
  font-size: 12px; line-height: 1.8;
}
.intel-circle {
  width: 64px; height: 64px; border: 2px solid var(--border);
  border-radius: 50%; margin: 0 auto 20px;
  border-top-color: var(--cyan); animation: spin 3s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.gen-btn {
  width: 100%; padding: 12px; margin-top: 20px;
  background: var(--panel-light); color: var(--cyan);
  border: 1px solid var(--cyan); border-radius: 6px; cursor: pointer;
  font-size: 13px; letter-spacing: 1px;
}
.gen-btn:hover { background: var(--cyan); color: #000; }

/* ===== Bottom ticker ===== */
.ticker {
  position: fixed; bottom: 0; left: 0; right: 0; height: 32px;
  background: var(--panel); border-top: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 20px;
  font-size: 11px; color: var(--text-dim); letter-spacing: 1px;
  z-index: 1000;
}
.ticker-label { color: var(--cyan); margin-right: 20px; }
.ticker-content {
  flex: 1; white-space: nowrap; overflow: hidden;
  animation: scroll 60s linear infinite;
}
@keyframes scroll {
  0% { transform: translateX(100%); }
  100% { transform: translateX(-100%); }
}

/* ===== Observatory panel (新增：顯示 news.json 資料) ===== */
.obs-section { padding: 16px 18px; border-bottom: 1px solid var(--border); }
.obs-title {
  font-size: 11px; letter-spacing: 2px; color: var(--cyan);
  margin-bottom: 10px;
}
.obs-headline {
  font-size: 12px; line-height: 1.6; color: var(--text-dim);
  padding: 10px; background: var(--panel-light); border-radius: 6px;
}
.obs-link {
  display: block; margin-top: 8px; font-size: 11px; color: var(--cyan);
  text-decoration: none; text-align: center;
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

@media (max-width: 1100px) {
  .app { grid-template-columns: 220px 1fr; }
  .right-panel { display: none; }
}
@media (max-width: 700px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .sidebar { max-height: 200px; }
  .topstats { gap: 10px; }
  .topstat-val { font-size: 14px; }
}
</style>
</head>
<body>

<!-- Top header -->
<div class="topbar">
  <div class="brand">
    <span class="brand-dot"></span>
    GEOINT <span style="color:var(--text-dim)">//</span> GLOBAL INTELLIGENCE
    <div class="mode-tabs" style="margin-left:16px;">
      <span class="mode-tab active">半自動</span>
      <span class="mode-tab">人工判讀</span>
    </div>
  </div>
  <div class="topstats">
    <div class="topstat"><div class="topstat-label">預設事件</div><div class="topstat-val" id="stat-events">20</div></div>
    <div class="topstat"><div class="topstat-label">我的事件</div><div class="topstat-val" id="stat-my">0</div></div>
    <div class="topstat"><div class="topstat-label">SC NODES</div><div class="topstat-val">12</div></div>
    <div class="topstat topstat-utc">
      <div class="topstat-label">TPE</div>
      <div class="topstat-val" id="clock">--:--:--</div>
    </div>
  </div>
</div>

<!-- Main layout -->
<div class="app">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-h">圖層</div>
      <div class="layer-item">
        <span class="layer-label"><span class="layer-dot" style="background:var(--red)"></span>風險 Choropleth</span>
        <div class="toggle on" onclick="this.classList.toggle('on')"></div>
      </div>
      <div class="layer-item">
        <span class="layer-label"><span class="layer-dot" style="background:var(--cyan)"></span>SC 節點</span>
        <div class="toggle on" onclick="this.classList.toggle('on')"></div>
      </div>
      <div class="layer-item">
        <span class="layer-label"><span class="layer-dot" style="background:var(--yellow)"></span>供應路線</span>
        <div class="toggle on" onclick="this.classList.toggle('on')"></div>
      </div>
      <div class="layer-item">
        <span class="layer-label"><span class="layer-dot" style="background:var(--red)"></span>預設事件</span>
        <div class="toggle on" onclick="this.classList.toggle('on')"></div>
      </div>
      <div class="layer-item">
        <span class="layer-label"><span class="layer-dot" style="background:var(--green)"></span>我的事件</span>
        <div class="toggle on" onclick="this.classList.toggle('on')"></div>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-h">事件篩選</div>
      <div class="filter-row">
        <button class="filter-btn active">ALL</button>
        <button class="filter-btn">SC</button>
        <button class="filter-btn">衝突</button>
        <button class="filter-btn">政策</button>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-h">政治風險指數</div>
      <div id="risk-list"></div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-h">快速定位</div>
      <div class="quicknav-item" onclick="flyTo(24, 121, 5)">▸ 台灣海峽</div>
      <div class="quicknav-item" onclick="flyTo(37, 128, 5)">▸ 東北亞</div>
      <div class="quicknav-item" onclick="flyTo(52, 5, 5)">▸ 歐洲 / ASML</div>
      <div class="quicknav-item" onclick="flyTo(37, -100, 4)">▸ 北美</div>
      <div class="quicknav-item" onclick="flyTo(29, 48, 5)">▸ 中東</div>
      <div class="quicknav-item" onclick="flyTo(50, 30, 5)">▸ 東歐</div>
      <div class="quicknav-item" onclick="flyTo(20, 0, 2)">▸ 全球</div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-h">我的事件</div>
      <div class="my-events-empty">
        尚無自訂事件<br>點下方按鈕新增
      </div>
      <button class="add-event-btn">＋ 新增地緣政治事件</button>
    </div>
  </div>

  <!-- Map -->
  <div id="map"></div>

  <!-- Right panel -->
  <div class="right-panel">
    <div class="right-h">
      <div class="right-title">
        <span>// 情報分析</span>
        <span class="right-title-right">AI · CLAUDE</span>
      </div>
    </div>

    <div class="intel-content">
      <div class="intel-circle"></div>
      點選地圖上任何節點、事件或國家，生成 AI 情報簡報
      <button class="gen-btn">▶ 生成情報簡報</button>
    </div>

    <!-- 觀測站資料面板（新增，整合 news.json） -->
    <div class="obs-section">
      <div class="obs-title">📡 觀測站 · 今日摘要</div>
      <div class="obs-headline" id="obs-headline">載入中...</div>
      <a class="obs-link" href="news.html">→ 開啟完整新聞面板</a>
    </div>
  </div>
</div>

<!-- Ticker -->
<div class="ticker">
  <span class="ticker-label">情報快訊</span>
  <div class="ticker-content" id="ticker">載入情報資訊...</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ===== 時鐘（台北時間）=====
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2, '0');
  const m = String(now.getMinutes()).padStart(2, '0');
  const s = String(now.getSeconds()).padStart(2, '0');
  const el = document.getElementById('clock');
  if (el) el.textContent = `${h}:${m}:${s}`;
}
updateClock();
setInterval(updateClock, 1000);

// ===== 地圖（OpenStreetMap + CSS 暗色濾鏡）=====
const map = L.map('map', {
  center: [25, 100],
  zoom: 3,
  minZoom: 2,
  maxZoom: 10,
  zoomControl: true,
  attributionControl: false
});

// OpenStreetMap — 完全免費、免 API Key
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  subdomains: ['a', 'b', 'c']
}).addTo(map);

function flyTo(lat, lng, zoom) {
  map.flyTo([lat, lng], zoom, { duration: 1.5 });
}

// ===== SC 節點（半導體供應鏈關鍵節點）=====
const scNodes = [
  { name: "TSMC 台南", lat: 22.99, lng: 120.22, type: "foundry", color: "#22d3ee" },
  { name: "TSMC 新竹", lat: 24.78, lng: 121.00, type: "foundry", color: "#22d3ee" },
  { name: "Samsung 平澤", lat: 36.99, lng: 127.08, type: "memory", color: "#f97316" },
  { name: "SK Hynix 利川", lat: 37.27, lng: 127.43, type: "memory", color: "#f97316" },
  { name: "SMIC 上海", lat: 31.32, lng: 121.56, type: "foundry", color: "#ef4444" },
  { name: "ASML Veldhoven", lat: 51.42, lng: 5.40, type: "equip", color: "#eab308" },
  { name: "Intel Oregon", lat: 45.52, lng: -122.98, type: "foundry", color: "#22c55e" },
  { name: "GlobalFoundries NY", lat: 42.93, lng: -73.69, type: "foundry", color: "#22c55e" },
  { name: "Rapidus 北海道", lat: 42.78, lng: 141.68, type: "foundry", color: "#60a5fa" },
  { name: "Tokyo Electron", lat: 35.65, lng: 139.84, type: "equip", color: "#eab308" },
  { name: "Micron 愛達荷", lat: 43.58, lng: -116.19, type: "memory", color: "#22c55e" },
  { name: "Infineon 德累斯頓", lat: 51.05, lng: 13.74, type: "foundry", color: "#f59e0b" }
];

scNodes.forEach(n => {
  L.circleMarker([n.lat, n.lng], {
    radius: 6, fillColor: n.color, color: '#fff',
    weight: 1, opacity: 1, fillOpacity: 0.9
  }).addTo(map).bindTooltip(n.name, { className: 'node-tip' });
});

// ===== 預設地緣政治事件 =====
const events = [
  { name: "台海軍演", lat: 24, lng: 121.5, risk: 8.5, cat: "衝突" },
  { name: "日韓 Chip 4 聯盟", lat: 36, lng: 128, risk: 5.5, cat: "政策" },
  { name: "美國出口管制", lat: 38.9, lng: -77, risk: 7.8, cat: "政策" },
  { name: "ASML 禁令", lat: 51.4, lng: 5.4, risk: 6.5, cat: "政策" },
  { name: "紅海航運", lat: 15, lng: 42, risk: 6.8, cat: "衝突" },
  { name: "烏克蘭戰爭", lat: 49, lng: 32, risk: 7.9, cat: "衝突" },
  { name: "中東緊張", lat: 32, lng: 35, risk: 6.2, cat: "衝突" },
  { name: "印度新 Fab", lat: 23, lng: 72, risk: 4.5, cat: "政策" }
];

events.forEach(e => {
  const color = e.risk > 7 ? '#ef4444' : e.risk > 5 ? '#f59e0b' : '#eab308';
  L.marker([e.lat, e.lng], {
    icon: L.divIcon({
      className: 'event-marker',
      html: `<div style="width:14px;height:14px;background:${color};transform:rotate(45deg);border:1px solid #fff;"></div>`,
      iconSize: [14, 14]
    })
  }).addTo(map).bindTooltip(`${e.name} (風險 ${e.risk})`);
});

// ===== 政治風險排行榜 =====
const riskRanking = [
  { c: "Taiwan", s: 8.5 },
  { c: "N. Korea", s: 8.2 },
  { c: "Russia", s: 7.9 },
  { c: "China", s: 7.2 },
  { c: "Iran", s: 6.8 },
  { c: "S. Korea", s: 4.8 },
  { c: "Netherlands", s: 3.5 },
  { c: "Japan", s: 3.0 },
  { c: "USA", s: 2.8 }
];

document.getElementById('risk-list').innerHTML = riskRanking.map(r => `
  <div class="risk-item">
    <div class="risk-row">
      <span class="risk-country">↑ ${r.c}</span>
      <span class="risk-score">${r.s}</span>
    </div>
    <div class="risk-bar"><div class="risk-fill" style="width:${r.s*10}%"></div></div>
  </div>
`).join('');

// ===== 從 observatory（news.json）讀取今日摘要 =====
async function loadObservatory() {
  try {
    const res = await fetch('data/news.json?t=' + Date.now());
    if (!res.ok) throw new Error();
    const data = await res.json();
    const headline = data.headline || '尚無資料';
    const d = new Date(data.generated_at);
    const edition = data.mode === 'evening' ? '🌆 晚間' : '🌅 早晨';
    document.getElementById('obs-headline').innerHTML = `
      <div style="font-size:10px;color:var(--text-dim);margin-bottom:6px;">
        ${d.toLocaleString('zh-TW')} · ${edition}
      </div>
      <div>${headline}</div>
    `;

    // Ticker 用新聞標題
    if (data.news && data.news.length > 0) {
      const tickerText = data.news.slice(0, 8).map(n =>
        `▪ ${n.title}`
      ).join('   ');
      document.getElementById('ticker').textContent = tickerText;
    }
  } catch (e) {
    document.getElementById('obs-headline').innerHTML =
      '<span style="color:var(--text-dim)">尚未有今日資料<br>等待觀測站首次推送</span>';
    document.getElementById('ticker').textContent =
      '▪ 系統啟動中 ▪ 等待觀測站資料 ▪ GEOINT v3 ▪';
  }
}
loadObservatory();
setInterval(loadObservatory, 300000);  // 每 5 分鐘自動更新
</script>
</body>
</html>
